name: Build Orbitstrap

on:
  # Build + publish a GitHub Release on every push to the main branches,
  # so the bootstrapper's update detector always finds the newest build.
  push:
    branches:
      - main
      - master

  # Run manually from the Actions tab ("Run workflow" button).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Get version from csproj
        id: version
        shell: pwsh
        run: |
          $version = Select-String -Path "Orbitstrap\Orbitstrap.csproj" -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $version) { $version = "0.0.0" }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Orbitstrap.sln

      - name: Publish single-file exe
        run: |
          dotnet publish Orbitstrap\Orbitstrap.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -o publish_output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbitstrap-exe
          path: publish_output/Orbitstrap.exe

      - name: Remove stale release with the same tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Orbitstrap v${{ steps.version.outputs.version }}
          files: publish_output/Orbitstrap.exe
          generate_release_notes: true