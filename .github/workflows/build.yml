name: Build Orbitstrap

on:
  # Run manually from the Actions tab ("Run workflow" button).
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the built exe"
        type: boolean
        default: false

  # Also run automatically when a version tag like v3.7.0 is pushed.
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Orbitstrap.sln

      - name: Publish single-file exe
        run: |
          dotnet publish Orbitstrap\Orbitstrap.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -o publish_output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbitstrap-exe
          path: publish_output/Orbitstrap.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          files: publish_output/Orbitstrap.exe
          generate_release_notes: true
