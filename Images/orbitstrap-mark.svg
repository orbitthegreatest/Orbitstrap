<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="45%" stop-color="#d10000"/>
      <stop offset="100%" stop-color="#6e0000"/>
    </linearGradient>
    <linearGradient id="bgFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- transparent background -->
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>

  <!-- four rotated notch-square segments, pinwheel around center -->
  <g id="segment">
    <path fill="url(#redFill)" stroke="#1a0000" stroke-width="10" stroke-linejoin="round"
      d="M 190,150
         L 462,150
         L 462,392
         L 392,392
         L 392,462
         L 150,462
         L 150,190
         Q 150,150 190,150 Z"/>

    <!-- inner bevel highlight -->
    <path fill="none" stroke="#ffb3b3" stroke-width="5" stroke-opacity="0.55" stroke-linejoin="round"
      d="M 176,168
         L 448,168
         L 448,378
         L 378,378
         L 378,448
         L 168,448
         L 168,190"/>

    <!-- diagonal corner accent -->
    <path fill="none" stroke="#ffe3e3" stroke-width="9" stroke-linecap="round" stroke-opacity="0.9"
      d="M 210,255 L 285,180"/>
    <path fill="none" stroke="#5a0000" stroke-width="9" stroke-linecap="round" stroke-opacity="0.6"
      d="M 340,180 L 260,260"/>

    <!-- corner rivets -->
    <circle cx="190" cy="190" r="10" fill="#3a0000"/>
    <circle cx="190" cy="190" r="10" fill="none" stroke="#ffb3b3" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="422" cy="150" r="8" fill="#3a0000"/>
    <circle cx="150" cy="422" r="8" fill="#3a0000"/>

    <!-- edge tick marks -->
    <path fill="none" stroke="#ffb3b3" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"
      d="M 200,432 L 250,432 M 175,300 L 175,340"/>
  </g>

  <use href="#segment" transform="rotate(90 512 512)"/>
  <use href="#segment" transform="rotate(180 512 512)"/>
  <use href="#segment" transform="rotate(270 512 512)"/>

  <!-- center mark: orbit graphic for Orbitstrap -->
  <g>
    <!-- core planet -->
    <circle cx="512" cy="512" r="20" fill="#ffffff"/>
    <circle cx="512" cy="512" r="20" fill="url(#redFill)" fill-opacity="0.35"/>

    <!-- three orbit rings at different tilts -->
    <ellipse cx="512" cy="512" rx="78" ry="30" fill="none" stroke="#ffffff" stroke-width="6"
      transform="rotate(0 512 512)"/>
    <ellipse cx="512" cy="512" rx="78" ry="30" fill="none" stroke="#ff4b4b" stroke-width="6" stroke-opacity="0.9"
      transform="rotate(60 512 512)"/>
    <ellipse cx="512" cy="512" rx="78" ry="30" fill="none" stroke="#ffb3b3" stroke-width="6" stroke-opacity="0.8"
      transform="rotate(120 512 512)"/>

    <!-- small satellite dots riding the orbits -->
    <circle cx="590" cy="512" r="8" fill="#ffffff"/>
    <circle cx="551" cy="581" r="7" fill="#ff4b4b"/>
    <circle cx="473" cy="581" r="7" fill="#ffb3b3"/>
  </g>
</svg>
